name: Replace index with tk-ramen version
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: |
          git config user.name "tk-ramen"
          git config user.email "koyamateppei8@gmail.com"
          git rm -q index.html
          git mv index-tk-ramen.html index.html
          git commit -m "Replace index.html with tk-ramen version"
          git push
















