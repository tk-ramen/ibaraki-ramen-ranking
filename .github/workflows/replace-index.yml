name: Replace index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: |
          set -e
          cp kenhoku_index_publish.html index.html
          rm kenhoku_index_publish.html
          rm .github/workflows/replace-index.yml
          git config user.name "tk-ramen"
          git config user.email "tk-ramen@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "早見表をページ最下部へ移動"
          git push
