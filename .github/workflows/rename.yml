name: Rename space to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          if [ -f space.html ] && [ ! -f index.html ]; then
            git config user.name "koyama-teppei"
            git config user.email "koyamateppei8@gmail.com"
            git mv space.html index.html
            git commit -m "Rename space.html to index.html"
            git push
          fi
